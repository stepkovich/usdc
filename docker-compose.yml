services:
  unified:
    build: .
    container_name: unified
    restart: always            # авторестарт при падении и перезагрузке VPS
    env_file: .env
    volumes:
      - ./data:/app/data       # журналы, сделки, данные стакана переживают пересоздание
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "3"
