services:
  scalper:
    build: .
    container_name: usdc
    restart: always            # авторестарт при падении и перезагрузке VPS
    env_file: .env             # ключи и параметры бота
    volumes:
      - ./data:/app/data       # журнал сделок и логи переживают пересоздание
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"
